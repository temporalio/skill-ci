# ABOUTME: Reusable workflow that packages a Temporal skill repo (as a ZIP artifact) and, if the version
# ABOUTME: in SKILL.md has been bumped, creates a GitHub Release and syncs the skill contents to three
# ABOUTME: plugin repos (cursor-temporal-plugin, codex-temporal-plugin, claude-temporal-plugin) via PRs.
# ABOUTME: Two release paths: (1) push to main with a manually-changed SKILL.md version, or (2) a one-click
# ABOUTME: `bump` input (patch/minor/major) that rewrites SKILL.md, pushes the bump to main, then releases.
# ABOUTME: The skill name is derived from the CALLER repo's name with the leading "skill-" prefix removed,
# ABOUTME: so nothing about the skill name is hardcoded. Callers invoke this via `uses:` (see README).
# ABOUTME: agents/openai.yaml is Codex-specific and is synced only to codex-temporal-plugin.
# ABOUTME: Secrets (passed by the caller, typically via `secrets: inherit`):
# ABOUTME:   SKILL_T_DEV_APP_ID — GitHub App ID   (sync job: cross-repo PRs)
# ABOUTME:   SKILL_T_DEV_KEY    — GitHub App key   (sync job: cross-repo PRs)
# ABOUTME:   RELEASE_SSH_KEY    — SSH deploy key   (package job: push the bump commit; only needed for `bump`)
# ABOUTME: The app must be installed on the three plugin repos with Contents (write) and Pull Requests (write).
# ABOUTME: The deploy key must have write access AND be in the default branch ruleset's bypass actors.

name: Package and Sync Skill (reusable)

on:
  workflow_call:
    inputs:
      includes:
        description: >-
          Space-separated whitelist of files/dirs that ARE part of the skill.
          Only these paths in the caller repo root are packaged and synced;
          everything else is ignored. Non-existent entries are skipped.
        type: string
        default: "SKILL.md agents references scripts"
      bump:
        description: >-
          Optional semver bump for a one-click release: "patch", "minor", or
          "major". When set, the workflow rewrites `version:` in SKILL.md, commits
          and pushes that to the default branch (via the RELEASE_SSH_KEY deploy
          key), then releases and syncs. Leave empty (the default, e.g. on push
          events) to release only when SKILL.md's version was changed manually.
        type: string
        default: ""
    secrets:
      SKILL_T_DEV_APP_ID:
        description: GitHub App ID used to open cross-repo sync PRs.
        required: true
      SKILL_T_DEV_KEY:
        description: GitHub App private key used to open cross-repo sync PRs.
        required: true
      RELEASE_SSH_KEY:
        description: >-
          SSH deploy key (write access, and listed in the branch ruleset's bypass
          actors) used to push the version-bump commit to the default branch.
          Required only when `bump` is set; unused on plain push releases.
        required: false

env:
  # Whitelist comes from the caller (or the input default). Only these paths in
  # the repo root are packaged into the ZIP and synced to the plugin repos, so
  # anything not listed (LICENSE, README.md, CI config, dotfiles, etc.) is
  # ignored — callers override `includes` to add new skill content (a new dir,
  # an extra top-level file). Entries that don't exist are silently skipped.
  SKILL_INCLUDES: ${{ inputs.includes }}

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      released: ${{ steps.tag_check.outputs.exists == 'false' }}
      skill_name: ${{ steps.meta.outputs.skill_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          # When RELEASE_SSH_KEY is set, configure the origin remote for SSH so the
          # bump step can push to the default branch with a key that bypasses the
          # branch ruleset. Empty (no bump / key not configured) => falls back to
          # the default token, preserving the plain push-release path.
          ssh-key: ${{ secrets.RELEASE_SSH_KEY }}

      - name: Compute skill name from repo name
        id: meta
        run: |
          # Derive the skill name from the caller repository's name, dropping the
          # leading "skill-" prefix (e.g. skill-temporal-cloud-setup -> temporal-cloud-setup).
          # In a reusable workflow, GITHUB_REPOSITORY is the CALLER repo.
          skill_name="${GITHUB_REPOSITORY##*/}"
          skill_name="${skill_name#skill-}"
          echo "skill_name=$skill_name" >> "$GITHUB_OUTPUT"
          echo "Skill name: $skill_name"

      - name: Resolve version (bump if requested)
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          # Current version from SKILL.md's `version:` line.
          current=$(grep '^version:' SKILL.md | sed 's/version:[[:space:]]*//')

          if [ -z "$BUMP" ]; then
            # No bump requested: release path is driven by a manual SKILL.md edit,
            # so just use whatever version is already there.
            version="$current"
            echo "No bump requested; using SKILL.md version $version"
          else
            # One-click release: compute the next semver, rewrite SKILL.md, and
            # push the bump to the default branch so the tag/release/sync below
            # operate on the new version.
            IFS='.' read -r major minor patch <<< "$current"
            case "$BUMP" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
              *) echo "Invalid bump '$BUMP' (expected patch|minor|major)" >&2; exit 1 ;;
            esac
            version="${major}.${minor}.${patch}"
            echo "Bumping $current -> $version ($BUMP)"

            # Replace only the first `version:` line.
            sed -i "0,/^version:.*/s//version: ${version}/" SKILL.md

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add SKILL.md
            # [skip ci] so the resulting push doesn't spawn a redundant push-run;
            # this dispatch run already carries the release/sync through.
            git commit -m "Bump ${{ steps.meta.outputs.skill_name }} skill version to v${version} [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check if tag exists
        id: tag_check
        run: |
          if git rev-parse "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package skill
        run: |
          # Zip only the whitelisted paths (zip -r recurses into any dirs).
          # Skip entries that don't exist so the whitelist can list optional
          # paths without breaking repos that omit them.
          include_args=()
          for i in $SKILL_INCLUDES; do
            if [ -e "$i" ]; then
              include_args+=("$i")
            else
              echo "Skipping missing include: $i"
            fi
          done
          if [ ${#include_args[@]} -eq 0 ]; then
            echo "No whitelisted paths found to package" >&2
            exit 1
          fi
          zip -r "${{ steps.meta.outputs.skill_name }}-skill.zip" "${include_args[@]}"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.meta.outputs.skill_name }}-skill
          path: ${{ steps.meta.outputs.skill_name }}-skill.zip

      - name: Create release
        if: steps.tag_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          # Tag the current branch tip. On a bump this is the bump commit we just
          # pushed (not the pre-dispatch SHA), so the tag records the new version.
          target_commitish: ${{ github.ref_name }}
          files: ${{ steps.meta.outputs.skill_name }}-skill.zip
          generate_release_notes: true

  sync:
    needs: package
    if: needs.package.outputs.released == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      # contents: write is required by the POST /releases/generate-notes endpoint,
      # even though it only returns text and doesn't actually write anything.
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # {name} is substituted with the derived skill name at step time
          # (matrix values are evaluated before steps run, so ${{ }} can't
          # reach the skill name here — we do the substitution ourselves).
          #
          # `excludes` is a space-separated list of whitelisted paths to leave
          # OUT of this particular target. agents/openai.yaml configures Codex,
          # so it's synced only to the codex plugin repo.
          - repo: temporalio/cursor-temporal-plugin
            target_path: skills/{name}
            excludes: agents/openai.yaml
          - repo: temporalio/codex-temporal-plugin
            target_path: plugins/temporal/skills/{name}
            excludes: ""
          - repo: temporalio/claude-temporal-plugin
            target_path: skills/{name}
            excludes: agents/openai.yaml

    steps:
      - name: Generate token from GitHub App
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.SKILL_T_DEV_APP_ID }}
          private-key: ${{ secrets.SKILL_T_DEV_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          # Check out the branch tip, not the SHA that triggered the run. On a
          # bump the package job pushed a new commit to the default branch, and
          # we must sync that (bumped) content — the trigger SHA predates it.
          ref: ${{ github.ref_name }}

      - name: Checkout target repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ matrix.repo }}
          token: ${{ steps.app-token.outputs.token }}
          path: target-repo

      - name: Compute target path
        run: |
          # Substitute {name} in the matrix's target_path template with the
          # derived skill name.
          name="${{ needs.package.outputs.skill_name }}"
          target_path="${{ matrix.target_path }}"
          target_path="${target_path//\{name\}/$name}"
          echo "target_path=$target_path" >> "$GITHUB_ENV"
          echo "Target path: $target_path"

      - name: Sync skill contents
        env:
          TARGET_EXCLUDES: ${{ matrix.excludes }}
        run: |
          NAME="${{ needs.package.outputs.skill_name }}"
          BRANCH="sync/${NAME}-skill"

          git -C target-repo config user.name "github-actions[bot]"
          git -C target-repo config user.email "github-actions[bot]@users.noreply.github.com"

          # Create or reset the sync branch based on current main.
          # -B ensures the branch always starts from main's tip, even if a
          # stale remote branch exists from a previously merged PR.
          git -C target-repo checkout -B "$BRANCH" origin/main

          # Mirror only the whitelisted paths into the skill's target path.
          # --delete removes files in the target that aren't whitelisted in
          # source, so renamed/removed skill files don't linger. We include
          # each whitelisted entry (and, if it's a dir, everything under it via
          # /***) then exclude everything else. A file-only entry's /*** rule is
          # harmless. This also naturally excludes target-repo, .git, CI config,
          # etc. since they aren't whitelisted.
          #
          # Per-target excludes come FIRST: rsync applies the first matching
          # rule, so an exclude has to precede the --include that would
          # otherwise pull the path in (e.g. agents/openai.yaml vs agents/***).
          include_args=()
          for e in $TARGET_EXCLUDES; do
            include_args+=(--exclude="/$e" --exclude="/$e/***")
          done
          for i in $SKILL_INCLUDES; do
            include_args+=(--include="/$i" --include="/$i/***")
          done
          dest="target-repo/${target_path}"
          mkdir -p "$dest"
          rsync -a --delete "${include_args[@]}" --exclude='*' ./ "$dest/"

          # rsync's --delete protects excluded paths on the receiving side, so
          # remove them explicitly: a target that was synced before this
          # exclusion existed must lose the file too.
          for e in $TARGET_EXCLUDES; do
            rm -rf "$dest/$e"
          done

          # Stage the target path (git add records deletions too).
          git -C target-repo add "${target_path}"
          if git -C target-repo diff --cached --quiet; then
            echo "no_changes=true" >> "$GITHUB_ENV"
            echo "No changes to sync"
          else
            echo "no_changes=false" >> "$GITHUB_ENV"
            version="${{ needs.package.outputs.tag }}"
            git -C target-repo commit -m "sync ${NAME} skill ${version} from source repo"
            git -C target-repo push --force origin "$BRANCH"
          fi

      - name: Build changelog
        if: env.no_changes == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_tag="${{ needs.package.outputs.tag }}"

          # Determine the base for the changelog: the version currently on the
          # target repo's main branch. This represents what was last merged, so
          # the changelog spans every release since then — correctly accumulating
          # unmerged versions if a prior sync PR is still open.
          #
          # Read the old SKILL.md from git (it's been overwritten on disk by the
          # sync step) via `git show origin/main:...`.
          target_version=$(git -C target-repo show "origin/main:${target_path}/SKILL.md" 2>/dev/null \
            | grep '^version:' | sed 's/version:[[:space:]]*//' || echo "")

          if [ -n "$target_version" ]; then
            base_tag="v${target_version}"
          else
            base_tag=""
          fi

          # The target repo's recorded version may not correspond to an
          # actual tag in this source repo (e.g. the target was last
          # updated from a different repo, or a tag was never published
          # for that version). If the tag doesn't exist locally, find the
          # most recent tag that's an ancestor of HEAD and predates the
          # current tag; if nothing matches, leave base_tag empty so the
          # fallback path runs.
          if [ -n "$base_tag" ] && ! git rev-parse --verify --quiet "refs/tags/${base_tag}" >/dev/null; then
            echo "Base tag ${base_tag} does not exist in this repo; searching for closest preceding tag"
            fallback_tag=$(git tag --sort=-v:refname | awk -v cur="$current_tag" '$0 != cur' | head -1 || true)
            if [ -n "$fallback_tag" ]; then
              echo "Using ${fallback_tag} as base tag instead"
              base_tag="$fallback_tag"
            else
              base_tag=""
            fi
          fi

          # Prefer GitHub's auto-generated notes for the range (nicely formatted
          # with PR links and contributors). Fall back to git log if unavailable.
          echo "Base tag: ${base_tag:-<none>} / Current tag: ${current_tag}"
          if [ -n "$base_tag" ]; then
            if notes=$(gh api \
                --method POST \
                "/repos/${{ github.repository }}/releases/generate-notes" \
                -f tag_name="${current_tag}" \
                -f previous_tag_name="${base_tag}" \
                --jq '.body') && [ -n "$notes" ]; then
              echo "Using auto-generated release notes"
              echo "$notes" > /tmp/changelog.md
            else
              echo "generate-notes API call failed or empty; falling back to git log"
              git log --oneline "${base_tag}..HEAD" > /tmp/changelog.md \
                || git log --oneline -20 > /tmp/changelog.md
            fi
          else
            echo "No base tag found; using last 20 commits"
            git log --oneline -20 > /tmp/changelog.md
          fi

      - name: Create or update PR
        if: env.no_changes == 'false'
        working-directory: target-repo
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          NAME="${{ needs.package.outputs.skill_name }}"
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          BRANCH="sync/${NAME}-skill"
          version="${{ needs.package.outputs.tag }}"
          changelog=$(cat /tmp/changelog.md)

          # Check if a PR already exists from this branch
          existing_pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')

          if [ -n "$existing_pr" ]; then
            echo "PR #${existing_pr} already exists — updated by the force-push"
            gh pr edit "$existing_pr" \
              --title "Sync ${NAME} skill ${version}" \
              --body "Automated sync of the ${NAME} skill ${version} from [${REPO_NAME}](https://github.com/${{ github.repository }}).

          This PR was updated automatically by the [sync workflow](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).

          ## Changelog
          ${changelog}"
            gh pr comment "$existing_pr" --body "Updated to ${version} from [${REPO_NAME}](https://github.com/${{ github.repository }})."
            pr_url=$(gh pr view "$existing_pr" --json url --jq '.url')
            pr_action="updated"
          else
            pr_url=$(gh pr create \
              --title "Sync ${NAME} skill ${version}" \
              --body "Automated sync of the ${NAME} skill ${version} from [${REPO_NAME}](https://github.com/${{ github.repository }}).

          This PR was created automatically by the [sync workflow](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).

          ## Changelog
          ${changelog}")
            pr_action="created"
          fi

          # Expose for the record/summary steps below.
          echo "PR_URL=$pr_url" >> "$GITHUB_ENV"
          echo "PR_ACTION=$pr_action" >> "$GITHUB_ENV"

          # Prominent per-job summary so the link is obvious on this job's page.
          {
            echo "## ✅ ${pr_action^} sync PR — \`${{ matrix.repo }}\`"
            echo ""
            echo "### 👉 [Review & merge this PR](${pr_url})"
            echo ""
            echo "\`${pr_url}\`"
            echo ""
            echo "> **Next step:** merge the PR above to publish \`${NAME}\` ${version} to \`${{ matrix.repo }}\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record PR result
        if: always()
        env:
          MATRIX_REPO: ${{ matrix.repo }}
        run: |
          # Write one machine-readable record per target repo so the final
          # `summary` job can aggregate all PR links into a single obvious list.
          # Fields: repo|status|url  (status: created|updated|nochanges|failed)
          mkdir -p pr-results
          status="${PR_ACTION:-}"
          if [ "${{ env.no_changes }}" = "true" ]; then
            status="nochanges"
          elif [ -z "$status" ]; then
            # PR step didn't run / didn't finish (e.g. sync failed).
            status="failed"
          fi
          safe="${MATRIX_REPO//\//-}"
          echo "${MATRIX_REPO}|${status}|${PR_URL:-}" > "pr-results/${safe}.txt"

      - name: Upload PR result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-result-${{ strategy.job-index }}
          path: pr-results/
          retention-days: 1

  # Consolidate the per-target results into ONE obvious summary so the user sees
  # every PR link and the "merge these" call-to-action in a single place, rather
  # than hunting through the three matrix jobs.
  summary:
    needs: [package, sync]
    if: always() && needs.sync.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: Download PR results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pr-result-*
          path: pr-results
          merge-multiple: true

      - name: Write consolidated summary
        env:
          NAME: ${{ needs.package.outputs.skill_name }}
          VERSION: ${{ needs.package.outputs.tag }}
        run: |
          set -euo pipefail

          created_updated=0
          rows=""
          # Each file is one line: repo|status|url
          for f in pr-results/*.txt; do
            [ -e "$f" ] || continue
            IFS='|' read -r repo status url < "$f"
            case "$status" in
              created)   icon="🆕"; label="Created";  action="**MERGE**" ;;
              updated)   icon="🔄"; label="Updated";  action="**MERGE**" ;;
              nochanges) icon="⏸️"; label="No changes"; action="—" ;;
              *)         icon="❌"; label="Failed";   action="check logs" ;;
            esac
            if [ "$status" = "created" ] || [ "$status" = "updated" ]; then
              created_updated=$((created_updated + 1))
              link="[Open PR ↗](${url})"
            elif [ -n "$url" ]; then
              link="[link](${url})"
            else
              link="—"
            fi
            rows="${rows}| ${icon} \`${repo}\` | ${label} | ${link} | ${action} |"$'\n'
          done

          {
            if [ "$created_updated" -gt 0 ]; then
              echo "# 🚀 ${NAME} ${VERSION} — action required"
              echo ""
              echo "## ⚠️ NEXT STEP: merge the ${created_updated} pull request(s) below to publish this skill."
              echo ""
              echo "The release is packaged, but it is **not live in the plugin repos until you merge these PRs.**"
            else
              echo "# ${NAME} ${VERSION} — nothing to merge"
              echo ""
              echo "No sync PRs were created (targets already up to date, or the sync did not run)."
            fi
            echo ""
            echo "| Target repo | Status | Pull request | Action |"
            echo "|-------------|--------|--------------|--------|"
            printf '%s' "$rows"
          } >> "$GITHUB_STEP_SUMMARY"

          # Also echo the links into the job log for anyone reading raw output.
          echo "::notice title=Merge these sync PRs::${created_updated} PR(s) awaiting merge for ${NAME} ${VERSION}"
          for f in pr-results/*.txt; do
            [ -e "$f" ] || continue
            IFS='|' read -r repo status url < "$f"
            if [ "$status" = "created" ] || [ "$status" = "updated" ]; then
              echo "  -> ${repo}: ${url}"
            fi
          done
